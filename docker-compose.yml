services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials:ro
    environment:
      - PYTHONUNBUFFERED=1
      - ANONYMIZED_TELEMETRY=False
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
